name: Deploy to Firebase

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install dependencies (functions)
        run: npm ci
        working-directory: ./functions

      - name: Deploy to Firebase
        # You must add FIREBASE_TOKEN as a repository secret
        # Get one by running `npx firebase login:ci` locally
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting,functions --non-interactive
